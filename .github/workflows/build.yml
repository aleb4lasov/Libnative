name: Build Overlay Library

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          
      - name: Compile for arm64-v8a
        run: |
          export NDK_PATH=$ANDROID_NDK_HOME
          export TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          # Компиляция
          $TOOLCHAIN/aarch64-linux-android21-clang \
            -c mod_overlay.cpp \
            -fPIC \
            -o mod_overlay.o
          
          # Линковка
          $TOOLCHAIN/aarch64-linux-android21-clang \
            -shared \
            mod_overlay.cpp \
            -o liboverlaymod.so
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liboverlaymod-arm64-v8a
          path: liboverlaymod.so
